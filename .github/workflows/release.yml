---
name: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  # Run this workflow on the completion of the build-integration workflow
  workflow_run:
    workflows:
      - build-integration
    types:
      - completed
    branches:
      - master

# required to upload artifacts to github releases
permissions:
  contents: write

jobs:
  requires-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Get Version
        id: version
        run: |
          CURRENT_VERSION="v$(cat VERSION)"
          if [[ $(git tag -l "${CURRENT_VERSION}") == "${CURRENT_VERSION}" ]]; then
            echo "Version ${CURRENT_VERSION} is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${CURRENT_VERSION} can be release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  release:
    needs: requires-release
    if: ${{ needs.requires-release.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Create tag for new version
        run: |
          CURRENT_VERSION="v$(cat VERSION)"
          git tag $CURRENT_VERSION
          git push origin $CURRENT_VERSION
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
