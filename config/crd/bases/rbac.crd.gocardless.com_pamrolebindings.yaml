---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: pamrolebindings.rbac.crd.gocardless.com
spec:
  group: rbac.crd.gocardless.com
  names:
    kind: PAMRoleBinding
    listKind: PAMRoleBindingList
    plural: pamrolebindings
    shortNames:
    - prb
    singular: pamrolebinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.entitlement
      name: Entitlement
      priority: 1
      type: string
    - jsonPath: .spec.roleRef.name
      name: Role
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PAMRoleBinding binds a role in its namespace to every user holding an active grant on a
          Google Cloud Privileged Access Manager (PAM) entitlement. PAM handles requests,
          approvals and expiry; theatre keeps one RoleBinding per grant holder, and removes it
          when the grant ends.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PAMRoleBindingSpec defines the desired state of PAMRoleBinding
            properties:
              entitlement:
                description: |-
                  Entitlement is the full resource name of a Google Cloud Privileged Access Manager
                  (PAM) entitlement. Every user with an active grant on it is bound to RoleRef in this
                  namespace, for as long as the grant lasts. rbac-manager only honours entitlements in
                  the Google Cloud project it runs in.

                  It's immutable: pointing a PAMRoleBinding at another entitlement would keep the old
                  one's bindings until they expire. Recreate the PAMRoleBinding instead.
                pattern: ^projects/[^/]+/locations/[^/]+/entitlements/[^/]+$
                type: string
                x-kubernetes-validations:
                - message: Entitlement is immutable
                  rule: self == oldSelf
              roleRef:
                description: RoleRef is the Role or ClusterRole to bind each grant
                  holder to.
                properties:
                  apiGroup:
                    description: APIGroup is the group for the resource being referenced
                    type: string
                  kind:
                    description: Kind is the type of resource being referenced
                    type: string
                  name:
                    description: Name is the name of resource being referenced
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: RoleRef is immutable
                  rule: self == oldSelf
            required:
            - entitlement
            - roleRef
            type: object
          status:
            description: PAMRoleBindingStatus defines the observed state of PAMRoleBinding
            properties:
              activeGrants:
                description: ActiveGrants are the grants currently bound, one per
                  user.
                items:
                  description: PAMGrant is an active PAM grant that this PAMRoleBinding
                    has bound.
                  properties:
                    approvers:
                      description: |-
                        Approvers are the email addresses of everyone who approved the grant, in order. Empty
                        if it needed no approval.
                      items:
                        type: string
                      type: array
                    endsAt:
                      description: |-
                        EndsAt is when the grant ends. The RoleBinding is removed then, even if PAM can't be
                        reached.
                      format: date-time
                      type: string
                    grant:
                      description: Grant is the full resource name of the PAM grant.
                      type: string
                    roleBinding:
                      description: RoleBinding is the name of the RoleBinding that
                        binds the user.
                      type: string
                    user:
                      description: User is the email address of the grant's requester,
                        and the RoleBinding's subject.
                      type: string
                  required:
                  - endsAt
                  - grant
                  - roleBinding
                  - user
                  type: object
                type: array
              conditions:
                description: Conditions describe the last sync with PAM.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: LastSyncTime is when the active grants were last listed
                  from PAM successfully.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
