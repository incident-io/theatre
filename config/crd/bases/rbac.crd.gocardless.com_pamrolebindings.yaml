          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              entitlement:
                description: |-
                  Entitlement is the full resource name of a PAM entitlement, e.g.
                  projects/my-project/locations/global/entitlements/my-entitlement. It must be in the
                  Google Cloud project rbac-manager runs in.
                pattern: ^projects/[^/]+/locations/[^/]+/entitlements/[^/]+$
                type: string
                x-kubernetes-validations:
                - message: Entitlement is immutable
                  rule: self == oldSelf
              roleRef:
