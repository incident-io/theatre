                  kind:
                    description: Kind is the type of resource being referenced
                    type: string
                  name:
                    description: Name is the name of resource being referenced
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: RoleRef is immutable
                  rule: self == oldSelf
            required:
            - entitlement
            - roleRef
            type: object
          status:
            properties:
              activeGrants:
                description: |-
                  ActiveGrants are the grants currently bound. A subject with several grants appears
                  once for each.
                items:
                  properties:
                    approvers:
                      description: Approvers are everyone who approved the grant,
                        in the order they approved.
                      items:
                        type: string
                      type: array
                    endsAt:
                      description: |-
                        EndsAt is when the grant ends. The RoleBinding is removed then, even if PAM can't be
                        reached.
                      format: date-time
                      type: string
                    grant:
